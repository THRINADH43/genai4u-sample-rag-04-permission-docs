name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests (fake model)
        run: python -m unittest discover -s tests -t . -v
      - name: Evaluation set (fails the build when retrieval hit rate is below 0.9)
        run: python evaluate.py --min 0.9
